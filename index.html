<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Hostel League</title>
    <style>
        :root {
            --bg: #000;
            --card: #161616;
            --card2: #222;
            --tx: #fff;
            --mu: #8d8d8d;
            --ac: #00d95f;
            --red: #ff4d4d
        }

        * {
            box-sizing: border-box;
            margin: 0;
            -webkit-tap-highlight-color: transparent
        }

        body {
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            max-width: 520px;
            margin: auto;
            padding-bottom: calc(72px + env(safe-area-inset-bottom))
        }

        header {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--bg);
            padding: calc(12px + env(safe-area-inset-top)) 16px 8px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -.5px;
            text-align: center;
        }

        h1 span {
            color: var(--ac)
        }

        .sub {
            color: var(--mu);
            font-size: 13px;
            text-align: center;
        }

        .days {
            display: flex;
            justify-content: center;
            gap: 6px;
            overflow-x: auto;
            padding: 10px 0 4px;
            scrollbar-width: none
        }

        .days::-webkit-scrollbar {
            display: none
        }

        .day {
            flex: none;
            padding: 8px 14px;
            border-radius: 20px;
            color: var(--mu);
            font-weight: 600;
            background: none;
            border: 0;
            font-size: 14px;
            cursor: pointer;
        }

        .day.on {
            background: var(--card2);
            color: var(--tx)
        }

        .grp {
            background: var(--card);
            border-radius: 16px;
            margin: 12px;
            overflow: hidden
        }

        .gh {
            padding: 12px 14px;
            background: var(--card2);
            font-weight: 700;
            font-size: 14px;
            text-align: center;
        }

        .m {
            display: grid;
            grid-template-columns: 58px 1fr 50px 1fr;
            align-items: center;
            gap: 6px;
            padding: 14px 12px;
            border-top: 1px solid #000;
            cursor: pointer
        }

        .m:first-of-type {
            border-top: 0
        }

        .m .st {
            color: var(--mu);
            font-size: 11px;
            font-weight: 700;
            background: var(--card2);
            border-radius: 6px;
            padding: 4px 0;
            text-align: center;
            white-space: nowrap;
        }

        .t {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            font-weight: 600
        }

        .t.h {
            justify-content: flex-end;
            text-align: right
        }

        .t.h .n {
            order: -1
        }

        .n {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .sc {
            text-align: center;
            font-weight: 800;
            font-size: 16px
        }

        .sc.up {
            color: var(--mu);
            font-weight: 600;
            font-size: 13px
        }

        .cr {
            flex: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 10px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 1px 2px #0006
        }

        .cr.l {
            width: 64px;
            height: 64px;
            font-size: 20px
        }

        .empty {
            color: var(--mu);
            text-align: center;
            padding: 50px 20px
        }

        table {
            width: calc(100% - 24px);
            margin: 12px;
            border-collapse: collapse;
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            font-size: 14px
        }

        th {
            color: var(--mu);
            font-weight: 600;
            font-size: 12px;
            padding: 10px 4px;
            background: var(--card2)
        }

        td {
            padding: 11px 4px;
            text-align: center;
            border-top: 1px solid #000
        }

        td.tn {
            text-align: left;
            font-weight: 600
        }

        td.tn div {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer
        }

        td.p {
            font-weight: 800
        }

        td.r {
            width: 30px;
            position: relative
        }

        tr.q td.r::before {
            content: "";
            position: absolute;
            left: 0;
            top: 6px;
            bottom: 6px;
            width: 3px;
            background: var(--ac);
            border-radius: 2px
        }

        .note {
            color: var(--mu);
            font-size: 12px;
            margin: 0 16px;
            text-align: center;
        }

        .tg {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 12px
        }

        .tc {
            background: var(--card);
            border-radius: 16px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px
        }

        .tc b {
            font-size: 15px
        }

        .tc small {
            color: var(--mu)
        }

        .th {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 16px
        }

        .th h2 {
            font-size: 22px
        }

        .sec {
            margin: 16px 16px 6px;
            font-weight: 800;
            text-align: center;
        }

        .pl {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-top: 1px solid #000
        }

        .pl:first-child {
            border-top: 0
        }

        .av {
            flex: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--card2) center/cover;
            display: grid;
            place-items: center;
            font-weight: 700;
            color: var(--mu);
            overflow: hidden
        }

        .av.l {
            width: 52px;
            height: 52px
        }

        .pl .i {
            flex: 1;
            min-width: 0
        }

        .pl .i small {
            color: var(--mu);
            display: block
        }

        .pos {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--card2);
            color: var(--ac)
        }

        a.call, a.call-btn {
            background: var(--card2);
            color: var(--ac);
            border: 1px solid var(--ac);
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        a.call:active, a.call-btn:active {
            background: rgba(0, 217, 95, 0.15);
            transform: scale(0.96);
        }

        .back {
            background: none;
            border: 0;
            color: var(--ac);
            font-size: 15px;
            font-weight: 600;
            padding: 12px 16px 0;
            cursor: pointer;
        }

        .big {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 20px 12px;
            text-align: center;
            gap: 6px
        }

        .big .t {
            flex-direction: column;
            cursor: pointer
        }

        .big .sc {
            font-size: 34px
        }

        .ev {
            padding: 10px 16px;
            border-top: 1px solid #000;
            display: flex;
            gap: 10px
        }

        .ev.a {
            flex-direction: row-reverse;
            text-align: right
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 520px;
            background: #0b0b0b;
            border-top: 1px solid #222;
            display: flex;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 9
        }

        nav button {
            flex: 1;
            background: none;
            border: 0;
            color: var(--mu);
            padding: 10px 0 8px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        nav button.on {
            color: var(--ac)
        }

        nav svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .motm-card {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15) 0%, rgba(34, 34, 34, 0.9) 100%);
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 14px;
            padding: 14px;
            margin: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .motm-star {
            font-size: 26px;
            line-height: 1;
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.6));
        }

        .motm-badge {
            background: #ffd700;
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 7px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .rank-badge {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            flex-shrink: 0;
        }

        .rank-1 { background: #ffd700; color: #000; }
        .rank-2 { background: #c0c0c0; color: #000; }
        .rank-3 { background: #cd7f32; color: #fff; }
        .rank-other { background: var(--card2); color: var(--mu); }

        .goals-count {
            font-weight: 800;
            font-size: 13px;
            color: var(--ac);
            background: var(--card2);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .c-badge {
            background: #ffd700;
            color: #000;
            font-weight: 800;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 4px;
            margin-left: 6px;
        }
    </style>
</head>

<body>

    <main id="app"></main>

    <script>

        const TEAMS = {

                pl: [

                pl: [
                    ["Adwaith (GK)", "GK", 1],

                    ["Anand", "DEF", 4],
                    ["Adwaith", "MID", 5],
                    ["Sinan", "MID", 6],
                    ["Mrinal", "MID", 7],
                    ["Dheeraj (C)", "FWD", 10],
                    ["Jagath", "FWD", 9],
                    ["Abhiram", "FWD", 11]
                ]
            },
            AVL: {
                name: "Aston Villa", c: "#9333ea", mgr: { name: "Sinan", photo: "" },
                pl: [
                    ["Yedhukrishna (GK)", "GK", 1],
                    ["Abdu", "DEF", 3],
                    ["Tahsin", "DEF", 4],
                    ["Adhith Anil", "MID", 5],
                    ["Ahdal", "MID", 6],
                    ["Shehzad", "MID", 7],
                    ["Ashik (C)", "FWD", 10],
                    ["Hijan Saidu", "FWD", 9],
                    ["Nijad", "FWD", 11]
                ]
            }
        };

        const MATCHES = [
            /* Round 1 */
            { r: 1, mNo: "Match 1", h: "FUL", a: "AVL", hs: null, as: null, g: [], motm: null },
            { r: 1, mNo: "Match 2", h: "SPR", a: "CRY", hs: null, as: null, g: [], motm: null },
            { r: 1, mNo: "Match 3", h: "NFO", a: "BHA", hs: null, as: null, g: [], motm: null },

            /* Round 2 */
            { r: 2, mNo: "Match 1", h: "CRY", a: "FUL", hs: null, as: null, g: [], motm: null },
            { r: 2, mNo: "Match 2", h: "BHA", a: "AVL", hs: null, as: null, g: [], motm: null },
            { r: 2, mNo: "Match 3", h: "NFO", a: "SPR", hs: null, as: null, g: [], motm: null },

            /* Round 3 */
            { r: 3, mNo: "Match 1", h: "FUL", a: "BHA", hs: null, as: null, g: [], motm: null },
            { r: 3, mNo: "Match 2", h: "CRY", a: "NFO", hs: null, as: null, g: [], motm: null },
            { r: 3, mNo: "Match 3", h: "AVL", a: "SPR", hs: null, as: null, g: [], motm: null },

            /* Round 4 */
            { r: 4, mNo: "Match 1", h: "NFO", a: "FUL", hs: null, as: null, g: [], motm: null },
            { r: 4, mNo: "Match 2", h: "SPR", a: "BHA", hs: null, as: null, g: [], motm: null },
            { r: 4, mNo: "Match 3", h: "AVL", a: "CRY", hs: null, as: null, g: [], motm: null },

            /* Round 5 */
            { r: 5, mNo: "Match 1", h: "FUL", a: "SPR", hs: null, as: null, g: [], motm: null },
            { r: 5, mNo: "Match 2", h: "NFO", a: "AVL", hs: null, as: null, g: [], motm: null },
            { r: 5, mNo: "Match 3", h: "BHA", a: "CRY", hs: null, as: null, g: [], motm: null }
        ];

        const COMMITTEE = [
            { role: "Organizing Committee", name: "SR", phone: "9605729219", photo: "" },
            { role: "Organizing Committee", name: "Famil", phone: "9400860394", photo: "" },
            { role: "Organizing Committee", name: "Abdu", phone: "9562491337", photo: "" }
        ];

        const RULES = [
            "The match will be Sixes (6's).",
            "12 minutes each half, with additional extra time at the referee's discretion.",
            "The referee's decision will be final regarding everything happening throughout the match.",
            "Any disrespect towards referees or players will result in a yellow or red card.",
            "Goalkeeper can come out of the D-box and play.",
            "Note: Opponents can charge the goalkeeper.",
            "Substitutions will be rotational.",
            "A goal kick directly above the half line will be considered a foul.",
            "A direct throw to goal is not considered.",
            "Penalty kicks must be taken as a standing kick. Running or multiple-step penalty kicks are not allowed.",
            "Any player can play in any position.",
            "Any player can stand as goalkeeper.",
            "A player who receives a red card will be suspended for the remainder of the match, but the team can continue playing with 6 players, excluding the player who received the red card.",
            "A minimum of 6 players must reach the ground and be ready before the main referee arrives. If not, the team will be disqualified."
        ];

        const QUALIFY = 2;
        const rounds = [1, 2, 3, 4, 5];

        /* Clear old storage so fresh state is always active */
        localStorage.clear();

        /* ============ APP LOGIC ============ */
        const $ = s => document.querySelector(s), app = $("#app");
        const done = m => m.hs != null;
        const cr = (id, l) => `<span class="cr ${l ? "l" : ""}" style="background:${TEAMS[id].c}">${id}</span>`;
        const ini = n => n.split(" ").map(w => w[0]).join("").slice(0, 2);
        const av = (n, p, c) => `<div class="av ${c || ""}" style="${p ? `background-image:url(${p})` : ""}">${p ? "" : ini(n)}</div>`;

        let S = { tab: "m", round: 1, team: null, match: null };

        function go(o) { Object.assign(S, o); render(); scrollTo(0, 0) }

        function row(m, i) {
            const f = done(m);
            const mIdx = MATCHES.indexOf(m);
            return `<div class="m" onclick="go({match:${mIdx}})">
                <span class="st">${f ? "FT" : m.mNo}</span>
                <div class="t h">${cr(m.h)}<span class="n">${TEAMS[m.h].name}</span></div>
                <div class="sc ${f ? "" : "up"}">${f ? m.hs + " - " + m.as : "vs"}</div>
                <div class="t">${cr(m.a)}<span class="n">${TEAMS[m.a].name}</span></div>
            </div>`;
        }

        function table() {
            const T = {}; Object.keys(TEAMS).forEach(k => T[k] = { k, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 });
            MATCHES.filter(done).forEach(m => {
                const h = T[m.h], a = T[m.a]; h.p++; a.p++; h.gf += m.hs; h.ga += m.as; a.gf += m.as; a.ga += m.hs;
                if (m.hs > m.as) { h.w++; a.l++; h.pts += 3 } else if (m.hs < m.as) { a.w++; h.l++; a.pts += 3 } else { h.d++; a.d++; h.pts++; a.pts++ }
            });
            return Object.values(T).sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf)
        }

        function topScorers() {
            const S = {};
            MATCHES.filter(done).forEach(m => {
                (m.g || []).forEach(g => {
                    const tid = g.t === "h" ? m.h : m.a;
                    const key = g.p + "_" + tid;
                    if (!S[key]) S[key] = { p: g.p, team: tid, goals: 0 };
                    S[key].goals++;
                });
            });
            return Object.values(S).sort((a, b) => b.goals - a.goals);
        }

        const views = {
            m() {
                $("#days").style.display = "flex";
                $("#days").innerHTML = rounds.map(r => `<button class="day ${r == S.round ? "on" : ""}" onclick="go({round:${r}})">Round ${r}</button>`).join("");
                const ms = MATCHES.filter(m => m.r == S.round);
                return ms.length ? `<div class="grp"><div class="gh">Round ${S.round} · ${LEAGUE.name} ${LEAGUE.accent}</div>${ms.map(row).join("")}</div>` : `<div class="empty">No matches in this round</div>`
            },
            t() { 
                return `<table><tr><th></th><th style="text-align:left">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${table().map((r, i) => `<tr class="${i < QUALIFY ? "q" : ""}"><td class="r">${i + 1}</td><td class="tn"><div onclick="go({tab:'k',team:'${r.k}'})">${cr(r.k)}${TEAMS[r.k].name}</div></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf - r.ga > 0 ? "+" : ""}${r.gf - r.ga}</td><td class="p">${r.pts}</td></tr>`).join("")}</table><p class="note">Green bar = qualifies for the final.</p>` 
            },
            s() {
                const list = topScorers();
                if (!list.length) {
                    return `<div class="sec">Golden Boot · Top Scorers</div>
                    <div class="empty" style="padding:40px 20px">
                        <div style="font-size:36px; margin-bottom:8px">🏆</div>
                        <div style="font-size:18px; font-weight:800; color:#fff; margin-bottom:6px">Top Scorers: TBD</div>
                        <div style="font-size:13px; color:var(--mu)">Leaderboard will update once matches begin</div>
                    </div>`;
                }
                return `<div class="sec">Golden Boot · Top Scorers</div><div class="grp">${list.map((s, i) => {
                    const rCls = i === 0 ? "rank-1" : i === 1 ? "rank-2" : i === 2 ? "rank-3" : "rank-other";
                    const isCap = s.p.includes("(C)");
                    const pName = s.p.replace(" (C)", "");
                    return `<div class="pl"><span class="rank-badge ${rCls}">${i + 1}</span>${cr(s.team)}<div class="i"><b>${pName}${isCap ? '<span class="c-badge">C</span>' : ''}</b><small>${TEAMS[s.team].name}</small></div><span class="goals-count">⚽ ${s.goals}</span></div>`;
                }).join("")}</div>`
            },
            k() {
                if (S.team) {
                    const t = TEAMS[S.team], O = ["GK", "DEF", "MID", "FWD"], ms = MATCHES.filter(m => m.h == S.team || m.a == S.team).sort((a, b) => a.r - b.r);
                    return `<button class="back" onclick="go({team:null})">‹ All teams</button><div class="th">${cr(S.team, 1)}<h2>${t.name}</h2></div>
 <div class="sec">Manager</div><div class="grp">${`<div class="pl">${av(t.mgr.name, t.mgr.photo, "l")}<div class="i"><b>${t.mgr.name}</b><small>Manager</small></div></div>`}</div>
 <div class="sec">Squad</div><div class="grp">${[...t.pl].sort((a, b) => O.indexOf(a[1]) - O.indexOf(b[1])).map(p => {
                        const isCap = p[0].includes("(C)");
                        const cleanName = p[0].replace(" (C)", "").replace(" (GK)", "");
                        return `<div class="pl">${av(cleanName, p[3])}<div class="i"><b>${cleanName}${isCap ? '<span class="c-badge">C</span>' : ''}</b><small>#${p[2]}</small></div><span class="pos">${p[1]}</span></div>`;
                    }).join("")}</div>
 <div class="sec">Matches</div><div class="grp">${ms.map(row).join("")}</div>`
                }
                return `<div class="tg">${Object.keys(TEAMS).map(k => `<div class="tc" onclick="go({team:'${k}'})">${cr(k, 1)}<b>${TEAMS[k].name}</b><small>${TEAMS[k].pl.length} players</small></div>`).join("")}</div>`
            },
            i() {
                const phoneIcon = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;
                return `<div class="sec">Organizing committee</div><div class="grp">${COMMITTEE.map(c => `<div class="pl">${av(c.name, c.photo, "l")}<div class="i"><b>${c.name}</b><small>${c.role}</small></div>${c.phone ? `<a class="call" href="tel:${c.phone}">${phoneIcon} Call</a>` : ""}</div>`).join("")}</div>
 <div class="sec">Rules & Regulations</div><div class="grp">${RULES.map((r, idx) => `<div class="pl"><div class="i"><b>${idx + 1}.</b> ${r}</div></div>`).join("")}</div>
 <p class="note" style="margin-top:14px; margin-bottom:14px">Venue: ${LEAGUE.venue}</p>`
            },
            match() {
                const mIdx = S.match;
                const m = MATCHES[mIdx], f = done(m);
                const motmCard = (f && m.motm) ? `<div class="motm-card"><div class="motm-star">⭐</div><div style="flex:1"><span class="motm-badge">MAN OF THE MATCH</span><div style="font-weight:800; font-size:15px; color:#fff; margin-top:3px">${m.motm.p}</div><div style="font-size:12px; color:var(--mu); display:flex; align-items:center; gap:6px; margin-top:4px">${cr(m.motm.team)} <span>${TEAMS[m.motm.team].name}</span></div></div></div>` : "";
                return `<button class="back" onclick="go({match:null})">‹ Back</button><div class="grp"><div class="gh">Round ${m.r} · ${m.mNo} · ${LEAGUE.venue}</div>
 <div class="big"><div class="t" onclick="go({match:null,tab:'k',team:'${m.h}'})">${cr(m.h, 1)}<span>${TEAMS[m.h].name}</span></div><div class="sc ${f ? "" : "up"}">${f ? m.hs + " - " + m.as : "vs"}</div><div class="t" onclick="go({match:null,tab:'k',team:'${m.a}'})">${cr(m.a, 1)}<span>${TEAMS[m.a].name}</span></div></div>
 ${motmCard}
 ${(m.g || []).map(g => `<div class="ev ${g.t == "a" ? "a" : ""}"><span>⚽ ${g.p}</span></div>`).join("")}
 ${f ? "" : `<div class="empty" style="padding:24px">Match Upcoming</div>`}
 </div>`
            }
        };

        const ic = {
            m: '<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/>',
            t: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
            s: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M18 4H6v7a6 6 0 0 0 12 0V4zM12 15v4"/>',
            k: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-4 3-6 6.5-6s6.5 2 6.5 6M17 4.5a3.5 3.5 0 010 7M21.5 20c0-3-1.5-5-4-5.8"/>',
            i: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'
        };

        const lab = { m: "Matches", t: "Table", s: "Stats", k: "Teams", i: "Info" };

        function render() {
            $("#ttl").innerHTML = `${LEAGUE.name} <span>${LEAGUE.accent}</span>`;
            $("#sub").textContent = LEAGUE.season;
            $("#days").style.display = "none";
            $("#nav").innerHTML = Object.keys(lab).map(k => `<button class="${S.tab == k ? "on" : ""}" onclick="go({tab:'${k}',match:null,team:null})"><svg viewBox="0 0 24 24">${ic[k]}</svg>${lab[k]}</button>`).join("");
            app.innerHTML = S.match != null ? views.match() : views[S.tab]()
        }

        render();
    </script>
</body>

</html>
